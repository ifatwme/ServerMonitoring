global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # Host + systemd + collector (sm_*) metrics. node-exporter is in the host network namespace and
  # listens on the monitor bridge gateway (MONITOR_GATEWAY in .env).
  - job_name: node
    static_configs: [{ targets: ["172.30.250.1:9100"], labels: { instance: host } }]

  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"], labels: { instance: host } }]
    metric_relabel_configs:
      # only real containers (+ the root cgroup for totals); drop per-interface noise of veths
      - source_labels: [id]
        regex: "/|/system.slice/docker-.*"
        action: keep
      - source_labels: [container_label_com_docker_compose_project]
        target_label: project
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: "container_label_com_docker_compose_(project|service)"
        action: labeldrop

  - job_name: blackbox-exporter
    static_configs: [{ targets: ["blackbox:9115"] }]

  # Uptime / TLS probes of each project's public URL (file written by the collector from config/projects.toml)
  - job_name: uptime
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /probe
    params: { module: [https_2xx] }
    file_sd_configs:
      - files: ["/etc/prometheus-targets/blackbox.json"]
        refresh_interval: 2m
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: url
      - target_label: __address__
        replacement: blackbox:9115
      - source_labels: [project]
        target_label: instance
