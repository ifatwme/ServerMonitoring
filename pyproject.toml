[project]
name = "servermon"
version = "0.2.0"
description = "Resource accountability for small multi-project Docker hosts: Prometheus + Grafana, CPU attribution to traffic classes, PSI/OOM-aware right-sizing, idle-project parking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []          # runtime is stdlib only, on purpose: it runs on the host from systemd

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[project.scripts]
projctl = "servermon.projctl:main"
sm-collect = "servermon.collector:main"
sm-analyze = "servermon.analyze:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 135
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
per-file-ignores = { "grafana/build_dashboards.py" = ["E501"] }
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901", "PLC0415", "SIM108", "B905", "E741"]
