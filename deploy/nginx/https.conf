# Public HTTPS front for Grafana. Grafana's own login (with brute-force lockout) is the access control;
# nginx adds per-IP rate limits, a strict budget for login attempts and basic security headers.
server_tokens off;

limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;
limit_req_status  429;
limit_conn_status 429;

map $http_upgrade $connection_upgrade { default upgrade; "" ""; }

server {
    listen 8443 ssl;                    # direct (healthcheck)
    listen 8444 ssl proxy_protocol;     # behind the SNI router; publish on 127.0.0.1 only
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header proxy_protocol;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 1m;
    client_body_timeout 20s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_conn conns 40;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location = /metrics { return 404; }             # Grafana's own internal metrics

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header Connection ""; proxy_read_timeout 120s; proxy_hide_header X-Frame-Options; proxy_hide_header X-Content-Type-Options;
    }
    location /api/live/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }
    location / {
        limit_req zone=perip burst=80 nodelay;
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto https; proxy_set_header Connection ""; proxy_read_timeout 120s; proxy_hide_header X-Frame-Options; proxy_hide_header X-Content-Type-Options;
    }
}
