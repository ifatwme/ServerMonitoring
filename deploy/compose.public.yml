# Optional override: publish Grafana over HTTPS behind a host TLS-passthrough (SNI) router.
#   COMPOSE_FILE=docker-compose.yml:deploy/compose.public.yml   (set in .env)
#
#   internet :443 ─► SNI router (PROXY protocol) ─► 127.0.0.1:${HTTPS_PORT} ─► web (TLS) ─► grafana:3000
#
# Prometheus and the exporters stay private; only Grafana (with its login) is reachable.
# TLS_DIR must contain fullchain.pem + privkey.pem readable by uid 101 (scripts/renew_cert.sh).
services:
  grafana:
    environment:
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: 7d
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: 30d

  web:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    # certificates are renewed on disk by the host timer; reload every 6 h to pick them up
    command: ["/bin/sh", "-c", "(while sleep 21600; do nginx -s reload; done) & exec nginx -g 'daemon off;'"]
    ports:
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:?set HTTPS_PORT in .env}:8444"   # 8444 = PROXY protocol
    volumes:
      - ./deploy/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-./deploy/tls}:/etc/nginx/tls:ro
    depends_on: [grafana]
    networks: [monitor]
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
