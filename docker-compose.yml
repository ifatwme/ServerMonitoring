# server-monitor: Prometheus + Grafana for every project on this host.
#
#   node-exporter  host metrics + systemd units + the collector's textfile (sm_* metrics)
#   cadvisor       per-container CPU / memory / network / disk I/O / PSI, grouped by compose project
#   blackbox       uptime + TLS expiry of each project's public URL (targets written by the collector)
#   prometheus     storage (retention capped by time AND size), recording + alert rules
#   grafana        dashboards, bound to localhost only (open it through an SSH tunnel)
#
# Nothing here listens on a public interface. node-exporter runs in the host network namespace
# (so network/socket stats are the host's) and listens only on this stack's bridge gateway.
name: server-monitor

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-90d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-2GB}
      - --storage.tsdb.wal-compression
      - --web.listen-address=:9090
    read_only: true
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ${SM_STATE_DIR:-/var/lib/server-monitor}/targets:/etc/prometheus-targets:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROM_PORT:-9090}:9090"]
    networks: [monitor]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.13.1
    command:
      - --path.rootfs=/host
      - --path.udev.data=/host/run/udev/data
      - --web.listen-address=${MONITOR_GATEWAY:-172.30.250.1}:9100
      - --collector.systemd
      - --collector.systemd.unit-include=${SYSTEMD_UNIT_INCLUDE:-(docker|containerd|ssh|cron|chrony|server-monitor.*)\.(service|timer)}
      - --collector.textfile.directory=/textfile
      - --collector.processes
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+|snap/.+)($|/)
      - --no-collector.wifi
      - --no-collector.infiniband
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.zfs
      - --no-collector.btrfs
    network_mode: host
    pid: host
    security_opt: ["no-new-privileges:true", "apparmor:unconfined"]   # docker-default AppArmor blocks D-Bus (systemd collector)
    read_only: true
    volumes:
      - /:/host:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - ${SM_STATE_DIR:-/var/lib/server-monitor}/textfile:/textfile:ro
    depends_on: [prometheus]   # creates the monitor bridge (and its gateway address) first
    mem_limit: 96m
    cpus: 0.5

  cadvisor:
    <<: *hardening
    image: ghcr.io/google/cadvisor:v0.61.1
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --enable_metrics=cpu,memory,network,diskIO,oom_event,pressure   # no "disk": du of every rootfs costs seconds of IO; the collector measures disk
    cap_add: [SYSLOG, DAC_READ_SEARCH]   # /dev/kmsg for OOM events; read the docker state dirs
    read_only: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices: ["/dev/kmsg:/dev/kmsg"]
    networks: [monitor]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100

  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    read_only: true
    volumes: ["./blackbox:/etc/blackbox:ro"]
    networks: [monitor]
    mem_limit: 64m
    cpus: 0.25

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?set GF_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GF_ROOT_URL:-http://localhost:3000/}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/overview.json
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_LOG_MODE: console
      GOMEMLIMIT: 380MiB            # make Go's GC work before the cgroup limit is hit
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    networks: [monitor]
    depends_on: [prometheus]
    mem_limit: 640m               # Grafana 13 idles at ~260 MB, ~450 MB (incl. page cache) while rendering
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  monitor:
    ipam:
      config:
        - subnet: ${MONITOR_SUBNET:-172.30.250.0/24}
          gateway: ${MONITOR_GATEWAY:-172.30.250.1}

volumes:
  prometheus-data:
  grafana-data:
